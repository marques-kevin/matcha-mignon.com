name: Agent PR issue sync

# Cursor's GitHub integration cannot comment on issues.
# When an agent opens a PR (content/*, meta/*, fix/*), post the PR link on the linked issue.

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  issues: write
  pull-requests: read

jobs:
  sync-issue:
    if: |
      startsWith(github.head_ref, 'content/') ||
      startsWith(github.head_ref, 'meta/') ||
      startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - name: Comment linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/Fixes\s+#(\d+)/i);

            if (!match) {
              core.info('No Fixes #N in PR body — skipping issue sync');
              return;
            }

            const issueNumber = parseInt(match[1], 10);
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `PR agent ouverte : ${pr.html_url}`,
            });
